<!doctype html><html lang="ja"><head><meta charset="utf-8"/><title>capture harness</title>
<style>html,body{margin:0;padding:0;width:1440px;height:900px;overflow:hidden;background:#fff}iframe{width:1440px;height:900px;border:0;display:block}</style>
</head><body>
